name: Build cs710aquickstart APK

on:
  push:
    branches:
      - main
      - build-bootstrap
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build cs710aquickstart debug APK
        run: ./gradlew :cs710aquickstart:assembleDebug --no-daemon --stacktrace

      - name: List built APK(s)
        run: |
          echo "APK build output:"
          ls -lh cs710aquickstart/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs710aquickstart-debug-${{ github.sha }}
          path: cs710aquickstart/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  screenshots:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cs710aquickstart-debug-${{ github.sha }}
          path: apk/

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p screenshots

            echo "Contents of apk/ directory:"
            ls -la apk/ || echo "(apk/ does not exist)"
            find apk/ -type f || true

            APK=$(find apk/ -type f -name "*.apk" | head -1)
            if [ -z "$APK" ]; then
              echo "ERROR: No .apk file found under apk/. Aborting screenshots."
              exit 1
            fi
            echo "Installing $APK"
            adb install -r -t "$APK"

            # Pre-grant runtime permissions to skip prompts
            adb shell pm grant com.csl.cs710aquickstart android.permission.BLUETOOTH_SCAN || true
            adb shell pm grant com.csl.cs710aquickstart android.permission.BLUETOOTH_CONNECT || true
            adb shell pm grant com.csl.cs710aquickstart android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.csl.cs710aquickstart android.permission.ACCESS_COARSE_LOCATION || true

            # MainActivity
            adb shell am start -n com.csl.cs710aquickstart/.MainActivity
            sleep 6
            adb exec-out screencap -p > screenshots/01_main.png

            # ScanActivity
            adb shell am start -n com.csl.cs710aquickstart/.ScanActivity
            sleep 5
            adb exec-out screencap -p > screenshots/02_scan.png

            # InventoryActivity
            adb shell am start -n com.csl.cs710aquickstart/.InventoryActivity
            sleep 5
            adb exec-out screencap -p > screenshots/03_inventory.png

            # GeigerSearchActivity
            adb shell am start -n com.csl.cs710aquickstart/.GeigerSearchActivity
            sleep 5
            adb exec-out screencap -p > screenshots/04_geiger.png

            ls -lh screenshots/

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs710aquickstart-screenshots-${{ github.sha }}
          path: screenshots/
          retention-days: 7
