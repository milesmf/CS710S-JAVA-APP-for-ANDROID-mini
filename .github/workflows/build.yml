name: Build cs710aquickstart APK

on:
  push:
    branches:
      - main
      - build-bootstrap
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build cs710aquickstart debug APK
        run: ./gradlew :cs710aquickstart:assembleDebug --no-daemon --stacktrace

      - name: Locate built APK
        id: find_apk
        run: |
          APK_PATH=$(find cs710aquickstart/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Built APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs710aquickstart-debug-${{ github.sha }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
